[package]
name = "mtg-player"
version = "0.1.0"
edition = "2021"

[dependencies]
mtg-engine = { path = "../mtg-engine" }
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true
