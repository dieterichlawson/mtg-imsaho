[workspace]
members = ["mtg-kernel", "mtg-engine", "mtg-player", "mtg-runner", "mtg-draft", "mtg-draft-runner"]
# The coverage-guided fuzz target builds on nightly with its own workspace.
exclude = ["fuzz"]
resolver = "2"

[workspace.lints.rust]
warnings = "deny" # Treat all compiler warnings as errors
# `cfg(kani)` gates the proofs in mtg-engine/src/proofs, which only the Kani
# verifier compiles; Verus sets `cfg(verus_only)` while it checks
# mtg-kernel (both run by scripts/prove.sh).
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(kani)", "cfg(verus_only)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that require major refactoring — allow for now
struct_excessive_bools = "allow"
# `legal_actions` and `submit_action` used to be 1,128 and 1,277 lines, and
# this said splitting them "would add indirection without simplification".
# They are 209 and 62 now, split by what each part is for, with no behaviour
# change and no test edited — so that claim did not survive contact. The lint
# stays allowed only for the handful of genuinely long match expressions that
# remain (collect_triggers, check_state_based_actions); re-check whether it can
# be denied outright once those are done.
too_many_lines = "allow"

# A number that wraps is a wrong game, and in a rules engine a silent one:
# 0 - 1 life, counters or mana as a u32 is four billion, and play carries on.
# Rust only checks for it in debug builds by default, and the nightly fuzz,
# the runners and the servers are all release builds, so an overflow the
# tests would stop on went by unseen everywhere the engine actually runs.
# Checked here it panics, which the fuzz files as a finding.
[profile.release]
overflow-checks = true
