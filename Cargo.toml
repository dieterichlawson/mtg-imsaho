[workspace]
members = ["mtg-engine", "mtg-player", "mtg-runner", "mtg-draft", "mtg-draft-runner"]
resolver = "2"

[workspace.lints.rust]
warnings = "deny" # Treat all compiler warnings as errors

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that require major refactoring — allow for now
struct_excessive_bools = "allow"
# Core engine functions (legal_actions, submit_action, etc.) are inherently
# large match expressions — splitting them would add indirection without
# simplification.
too_many_lines = "allow"
