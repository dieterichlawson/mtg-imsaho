[package]
name = "mtg-draft-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
mtg-engine = { path = "../mtg-engine" }
mtg-player = { path = "../mtg-player" }
mtg-draft = { path = "../mtg-draft" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
