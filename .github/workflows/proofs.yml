# The engine's Kani proofs (mtg-engine/src/proofs/; the plan and the list
# of what each proves is docs/plans/formal-verification.md).
#
# A proof is a theorem over every input inside its stated bounds, not a
# sample, so GREEN means no input in that space breaks any of the
# properties, and RED means a change broke one: the log names the property,
# and scripts/prove.sh says how to get the counterexample as a unit test.
#
# Its own workflow rather than a step in tests.yml: Kani brings its own
# toolchain, and the proofs run one at a time (each takes a few GB) for
# about six minutes.
name: proofs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pinned: a new Kani can change what proves and how long it takes, so
      # it is bumped deliberately, with scripts/prove.sh's version beside it.
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      - name: Prove
        run: scripts/prove.sh
